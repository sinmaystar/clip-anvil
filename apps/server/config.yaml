server:
  port: 8888

postgres:
  dsn: "postgres://clipanvil:clipanvil_dev@localhost:5432/clipanvil?sslmode=disable"

redis:
  addr: "localhost:6379"

minio:
  endpoint: "localhost:9000"
  sandbox_endpoint: "host.docker.internal:9000"
  access_key: "clipanvil"
  secret_key: "clipanvil_dev"
  use_ssl: false

jwt:
  secret: "dev-secret-change-in-prod"
  expire_hours: 72

sandbox:
  endpoint: "http://localhost:8080/v1"
  api_key: "clipanvil-dev-sandbox-key"
  image: "clipanvil-sandbox:dev"
  timeout_seconds: 1800
  workdir: "/workspace"
  use_server_proxy: true
  resource_limits:
    cpu: "2"
    memory: "4Gi"

agent:
  producer_max_tool_calls: 1000
  tool_timeout_seconds: 300

production:
  provider_mode: "mock"
  default_provider: "mock"
  default_text_model: "mock-text"
  worker_concurrency: 2
  provider_poll_interval_seconds: 5
  provider_max_poll_seconds: 1800
  volcengine:
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    region: "cn-beijing"
    text_model: "doubao-seed-2-0-mini-260428"
    image_model: "doubao-seedream-5-0-260128"
    video_model: "doubao-seedance-1-0-pro-fast-251015"
    audio_model: ""
    tos:
      bucket: "clip-anvil-temp-bucket"
      endpoint: "tos-cn-beijing.volces.com"
      region: "cn-beijing"
      public_base_url: "https://clip-anvil-temp-bucket.tos-cn-beijing.volces.com"
      signed_url_ttl_seconds: 3600
