services:
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: clipanvil
      POSTGRES_PASSWORD: ${PG_PASSWORD:-clipanvil_dev}
      POSTGRES_DB: clipanvil
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-clipanvil}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-clipanvil_dev}
    volumes:
      - minio_data:/data

  opensandbox-server:
    image: opensandbox/server:latest
    command: ["--config", "/etc/opensandbox/sandbox.toml"]
    ports:
      - "8080:8080"
    environment:
      OPENSANDBOX_SERVER_API_KEY: clipanvil-dev-sandbox-key
    volumes:
      - ./config/sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - opensandbox_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf

volumes:
  pg_data:
  minio_data:
  opensandbox_data:
