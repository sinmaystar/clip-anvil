name: clipanvil-coze-loop

services:
  coze-loop-app:
    image: "${COZE_LOOP_APP_IMAGE_REGISTRY}/${COZE_LOOP_APP_IMAGE_REPOSITORY}/${COZE_LOOP_APP_IMAGE_NAME}:${COZE_LOOP_APP_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-app
    ports:
      - "${COZE_LOOP_APP_OPENAPI_PORT}:8888"
    volumes:
      - coze_loop_nginx_data:/coze-loop/resources
      - ./cozeloop/bootstrap/app:/coze-loop/bootstrap:ro
      - ./cozeloop/conf:/coze-loop/conf:ro
    depends_on:
      coze-loop-redis:
        condition: service_healthy
      coze-loop-mysql:
        condition: service_healthy
      coze-loop-mysql-init:
        condition: service_completed_successfully
      coze-loop-clickhouse:
        condition: service_healthy
      coze-loop-clickhouse-init:
        condition: service_completed_successfully
      coze-loop-minio:
        condition: service_healthy
      coze-loop-minio-init:
        condition: service_completed_successfully
      coze-loop-rmq-namesrv:
        condition: service_healthy
      coze-loop-rmq-broker:
        condition: service_healthy
      coze-loop-rmq-init:
        condition: service_completed_successfully
      coze-loop-python-faas:
        condition: service_healthy
      coze-loop-js-faas:
        condition: service_healthy
    environment:
      COZE_LOOP_REDIS_DOMAIN: "${COZE_LOOP_REDIS_DOMAIN}"
      COZE_LOOP_REDIS_PORT: "${COZE_LOOP_REDIS_PORT}"
      COZE_LOOP_REDIS_PASSWORD: "${COZE_LOOP_REDIS_PASSWORD}"
      COZE_LOOP_MYSQL_DOMAIN: "${COZE_LOOP_MYSQL_DOMAIN}"
      COZE_LOOP_MYSQL_PORT: "${COZE_LOOP_MYSQL_PORT}"
      COZE_LOOP_MYSQL_USER: "${COZE_LOOP_MYSQL_USER}"
      COZE_LOOP_MYSQL_PASSWORD: "${COZE_LOOP_MYSQL_PASSWORD}"
      COZE_LOOP_MYSQL_DATABASE: "${COZE_LOOP_MYSQL_DATABASE}"
      COZE_LOOP_CLICKHOUSE_DOMAIN: "${COZE_LOOP_CLICKHOUSE_DOMAIN}"
      COZE_LOOP_CLICKHOUSE_PORT: "${COZE_LOOP_CLICKHOUSE_PORT}"
      COZE_LOOP_CLICKHOUSE_USER: "${COZE_LOOP_CLICKHOUSE_USER}"
      COZE_LOOP_CLICKHOUSE_PASSWORD: "${COZE_LOOP_CLICKHOUSE_PASSWORD}"
      COZE_LOOP_CLICKHOUSE_DATABASE: "${COZE_LOOP_CLICKHOUSE_DATABASE}"
      COZE_LOOP_OSS_PROTOCOL: "${COZE_LOOP_OSS_PROTOCOL}"
      COZE_LOOP_OSS_DOMAIN: "${COZE_LOOP_OSS_DOMAIN}"
      COZE_LOOP_OSS_PORT: "${COZE_LOOP_OSS_PORT}"
      COZE_LOOP_OSS_USER: "${COZE_LOOP_OSS_USER}"
      COZE_LOOP_OSS_PASSWORD: "${COZE_LOOP_OSS_PASSWORD}"
      COZE_LOOP_OSS_REGION: "${COZE_LOOP_OSS_REGION}"
      COZE_LOOP_OSS_BUCKET: "${COZE_LOOP_OSS_BUCKET}"
      COZE_LOOP_RMQ_NAMESRV_DOMAIN: "${COZE_LOOP_RMQ_NAMESRV_DOMAIN}"
      COZE_LOOP_RMQ_NAMESRV_PORT: "${COZE_LOOP_RMQ_NAMESRV_PORT}"
      COZE_LOOP_PYTHON_FAAS_DOMAIN: "${COZE_LOOP_PYTHON_FAAS_DOMAIN}"
      COZE_LOOP_PYTHON_FAAS_PORT: "${COZE_LOOP_PYTHON_FAAS_PORT}"
      COZE_LOOP_JS_FAAS_DOMAIN: "${COZE_LOOP_JS_FAAS_DOMAIN}"
      COZE_LOOP_JS_FAAS_PORT: "${COZE_LOOP_JS_FAAS_PORT}"
    entrypoint: ["sh", "/coze-loop/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop/bootstrap/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 10s

  coze-loop-nginx:
    image: "${COZE_LOOP_NGINX_IMAGE_REGISTRY}/${COZE_LOOP_NGINX_IMAGE_REPOSITORY}/${COZE_LOOP_NGINX_IMAGE_NAME}:${COZE_LOOP_NGINX_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-nginx
    ports:
      - "${COZE_LOOP_NGINX_PORT}:80"
    volumes:
      - coze_loop_nginx_data:/usr/share/nginx/html:ro
      - ./cozeloop/bootstrap/nginx:/coze-loop-nginx/bootstrap:ro
    depends_on:
      coze-loop-app:
        condition: service_healthy
    environment:
      COZE_LOOP_OSS_PROTOCOL: "${COZE_LOOP_OSS_PROTOCOL}"
      COZE_LOOP_OSS_DOMAIN: "${COZE_LOOP_OSS_DOMAIN}"
      COZE_LOOP_OSS_PORT: "${COZE_LOOP_OSS_PORT}"
      COZE_LOOP_OSS_BUCKET: "${COZE_LOOP_OSS_BUCKET}"
    entrypoint: ["sh", "/coze-loop-nginx/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-nginx/bootstrap/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  coze-loop-redis:
    image: "${COZE_LOOP_REDIS_IMAGE_REGISTRY}/${COZE_LOOP_REDIS_IMAGE_REPOSITORY}/${COZE_LOOP_REDIS_IMAGE_NAME}:${COZE_LOOP_REDIS_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-redis
          - cozeloop-redis
    volumes:
      - coze_loop_redis_data:/data
      - ./cozeloop/bootstrap/redis:/coze-loop-redis/bootstrap:ro
    environment:
      COZE_LOOP_REDIS_PASSWORD: "${COZE_LOOP_REDIS_PASSWORD}"
    entrypoint: ["sh", "/coze-loop-redis/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-redis/bootstrap/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  coze-loop-mysql:
    image: "${COZE_LOOP_MYSQL_IMAGE_REGISTRY}/${COZE_LOOP_MYSQL_IMAGE_REPOSITORY}/${COZE_LOOP_MYSQL_IMAGE_NAME}:${COZE_LOOP_MYSQL_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-mysql
          - cozeloop-mysql
    volumes:
      - coze_loop_mysql_data:/var/lib/mysql
      - ./cozeloop/bootstrap/mysql:/coze-loop-mysql/bootstrap:ro
    environment:
      COZE_LOOP_MYSQL_USER: "${COZE_LOOP_MYSQL_USER}"
      COZE_LOOP_MYSQL_PASSWORD: "${COZE_LOOP_MYSQL_PASSWORD}"
      COZE_LOOP_MYSQL_DATABASE: "${COZE_LOOP_MYSQL_DATABASE}"
    entrypoint: ["sh", "/coze-loop-mysql/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-mysql/bootstrap/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  coze-loop-mysql-init:
    image: "${COZE_LOOP_MYSQL_IMAGE_REGISTRY}/${COZE_LOOP_MYSQL_IMAGE_REPOSITORY}/${COZE_LOOP_MYSQL_IMAGE_NAME}:${COZE_LOOP_MYSQL_IMAGE_TAG}"
    restart: "no"
    networks:
      - coze-loop-network
    volumes:
      - ./cozeloop/bootstrap/mysql-init:/coze-loop-mysql-init/bootstrap:ro
    depends_on:
      coze-loop-mysql:
        condition: service_healthy
    environment:
      COZE_LOOP_MYSQL_USER: "${COZE_LOOP_MYSQL_USER}"
      COZE_LOOP_MYSQL_PASSWORD: "${COZE_LOOP_MYSQL_PASSWORD}"
      COZE_LOOP_MYSQL_DATABASE: "${COZE_LOOP_MYSQL_DATABASE}"
    entrypoint: ["sh", "/coze-loop-mysql-init/bootstrap/entrypoint.sh"]

  coze-loop-clickhouse:
    image: "${COZE_LOOP_CLICKHOUSE_IMAGE_REGISTRY}/${COZE_LOOP_CLICKHOUSE_IMAGE_REPOSITORY}/${COZE_LOOP_CLICKHOUSE_IMAGE_NAME}:${COZE_LOOP_CLICKHOUSE_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-clickhouse
          - cozeloop-clickhouse
    volumes:
      - coze_loop_clickhouse_data:/var/lib/clickhouse
      - ./cozeloop/bootstrap/clickhouse:/coze-loop-clickhouse/bootstrap:ro
    user: "101:101"
    environment:
      COZE_LOOP_CLICKHOUSE_USER: "${COZE_LOOP_CLICKHOUSE_USER}"
      COZE_LOOP_CLICKHOUSE_PASSWORD: "${COZE_LOOP_CLICKHOUSE_PASSWORD}"
    entrypoint: ["sh", "/coze-loop-clickhouse/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-clickhouse/bootstrap/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  coze-loop-clickhouse-init:
    image: "${COZE_LOOP_CLICKHOUSE_IMAGE_REGISTRY}/${COZE_LOOP_CLICKHOUSE_IMAGE_REPOSITORY}/${COZE_LOOP_CLICKHOUSE_IMAGE_NAME}:${COZE_LOOP_CLICKHOUSE_IMAGE_TAG}"
    restart: "no"
    networks:
      - coze-loop-network
    volumes:
      - ./cozeloop/bootstrap/clickhouse-init:/coze-loop-clickhouse-init/bootstrap:ro
    depends_on:
      coze-loop-clickhouse:
        condition: service_healthy
    environment:
      COZE_LOOP_CLICKHOUSE_USER: "${COZE_LOOP_CLICKHOUSE_USER}"
      COZE_LOOP_CLICKHOUSE_PASSWORD: "${COZE_LOOP_CLICKHOUSE_PASSWORD}"
      COZE_LOOP_CLICKHOUSE_DATABASE: "${COZE_LOOP_CLICKHOUSE_DATABASE}"
    entrypoint: ["sh", "/coze-loop-clickhouse-init/bootstrap/entrypoint.sh"]

  coze-loop-minio:
    image: "${COZE_LOOP_OSS_IMAGE_REGISTRY}/${COZE_LOOP_OSS_IMAGE_REPOSITORY}/${COZE_LOOP_OSS_IMAGE_NAME}:${COZE_LOOP_OSS_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-minio
          - cozeloop-minio
    volumes:
      - coze_loop_minio_data:/minio_data
      - coze_loop_minio_config:/root/.minio
      - ./cozeloop/bootstrap/minio:/coze-loop-minio/bootstrap:ro
    environment:
      COZE_LOOP_OSS_USER: "${COZE_LOOP_OSS_USER}"
      COZE_LOOP_OSS_PASSWORD: "${COZE_LOOP_OSS_PASSWORD}"
    entrypoint: ["sh", "/coze-loop-minio/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-minio/bootstrap/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  coze-loop-minio-init:
    image: "${COZE_LOOP_OSS_IMAGE_REGISTRY}/${COZE_LOOP_OSS_IMAGE_REPOSITORY}/${COZE_LOOP_OSS_IMAGE_NAME}:${COZE_LOOP_OSS_IMAGE_TAG}"
    restart: "no"
    networks:
      - coze-loop-network
    volumes:
      - ./cozeloop/bootstrap/minio-init:/coze-loop-minio-init/bootstrap:ro
    depends_on:
      coze-loop-minio:
        condition: service_healthy
    environment:
      COZE_LOOP_OSS_USER: "${COZE_LOOP_OSS_USER}"
      COZE_LOOP_OSS_PASSWORD: "${COZE_LOOP_OSS_PASSWORD}"
      COZE_LOOP_OSS_BUCKET: "${COZE_LOOP_OSS_BUCKET}"
    entrypoint: ["sh", "/coze-loop-minio-init/bootstrap/entrypoint.sh"]

  coze-loop-rmq-namesrv:
    image: "${COZE_LOOP_RMQ_IMAGE_REGISTRY}/${COZE_LOOP_RMQ_IMAGE_REPOSITORY}/${COZE_LOOP_RMQ_IMAGE_NAME}:${COZE_LOOP_RMQ_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-rmq-namesrv
          - cozeloop-namesrv
    volumes:
      - coze_loop_rmq_namesrv_data:/store
      - ./cozeloop/bootstrap/rmq-namesrv:/coze-loop-rmq-namesrv/bootstrap:ro
    user: "0:0"
    entrypoint: ["sh", "/coze-loop-rmq-namesrv/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-rmq-namesrv/bootstrap/healthcheck.sh"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

  coze-loop-rmq-broker:
    image: "${COZE_LOOP_RMQ_IMAGE_REGISTRY}/${COZE_LOOP_RMQ_IMAGE_REPOSITORY}/${COZE_LOOP_RMQ_IMAGE_NAME}:${COZE_LOOP_RMQ_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-rmq-broker
          - cozeloop-broker
    volumes:
      - coze_loop_rmq_broker_data:/store
      - ./cozeloop/bootstrap/rmq-broker:/coze-loop-rmq-broker/bootstrap:ro
    depends_on:
      coze-loop-rmq-namesrv:
        condition: service_healthy
    user: "0:0"
    entrypoint: ["sh", "/coze-loop-rmq-broker/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-rmq-broker/bootstrap/healthcheck.sh"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s

  coze-loop-rmq-init:
    image: "${COZE_LOOP_RMQ_IMAGE_REGISTRY}/${COZE_LOOP_RMQ_IMAGE_REPOSITORY}/${COZE_LOOP_RMQ_IMAGE_NAME}:${COZE_LOOP_RMQ_IMAGE_TAG}"
    restart: "no"
    networks:
      - coze-loop-network
    volumes:
      - ./cozeloop/bootstrap/rmq-init:/coze-loop-rmq-init/bootstrap:ro
    depends_on:
      coze-loop-rmq-namesrv:
        condition: service_healthy
      coze-loop-rmq-broker:
        condition: service_healthy
    entrypoint: ["bash", "/coze-loop-rmq-init/bootstrap/entrypoint.sh"]

  coze-loop-python-faas:
    image: "${COZE_LOOP_PYTHON_FAAS_IMAGE_REGISTRY}/${COZE_LOOP_PYTHON_FAAS_IMAGE_REPOSITORY}/${COZE_LOOP_PYTHON_FAAS_IMAGE_NAME}:${COZE_LOOP_PYTHON_FAAS_IMAGE_TAG}"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-python-faas
    volumes:
      - coze_loop_python_faas_workspace:/tmp/faas-workspace
      - ./cozeloop/bootstrap/python-faas:/coze-loop-python-faas/bootstrap:ro
    environment:
      DENO_DIR: "${DENO_DIR}"
      DENO_NO_UPDATE_CHECK: "${DENO_NO_UPDATE_CHECK}"
      DENO_V8_FLAGS: "${DENO_V8_FLAGS}"
      FAAS_WORKSPACE: "${FAAS_WORKSPACE}"
      FAAS_PORT: "${FAAS_PORT}"
      FAAS_TIMEOUT: "${FAAS_TIMEOUT}"
      FAAS_LANGUAGE: "${FAAS_LANGUAGE}"
      NUMPY_VERSION: "${NUMPY_VERSION}"
      PANDAS_VERSION: "${PANDAS_VERSION}"
      JSONSCHEMA_VERSION: "${JSONSCHEMA_VERSION}"
      SCIPY_VERSION: "${SCIPY_VERSION}"
      SKLEARN_VERSION: "${SKLEARN_VERSION}"
    working_dir: /app
    entrypoint: ["sh", "/coze-loop-python-faas/bootstrap/entrypoint.sh"]
    tmpfs:
      - /tmp:noexec,nosuid,size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-python-faas/bootstrap/healthcheck.sh"]
      interval: 60s
      timeout: 20s
      retries: 20
      start_period: 120s

  coze-loop-js-faas:
    image: "denoland/deno:1.45.5"
    restart: unless-stopped
    networks:
      coze-loop-network:
        aliases:
          - coze-loop-js-faas
    volumes:
      - coze_loop_js_faas_workspace:/tmp/faas-workspace
      - ./cozeloop/bootstrap/js-faas:/coze-loop-js-faas/bootstrap:ro
    environment:
      DENO_DIR: "/tmp/.deno"
      DENO_NO_UPDATE_CHECK: "1"
      FAAS_WORKSPACE: "/tmp/faas-workspace"
      FAAS_PORT: "8000"
      FAAS_TIMEOUT: "30000"
      FAAS_LANGUAGE: "javascript"
    working_dir: /app
    entrypoint: ["sh", "/coze-loop-js-faas/bootstrap/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "/coze-loop-js-faas/bootstrap/healthcheck.sh"]
      interval: 60s
      timeout: 20s
      retries: 20
      start_period: 120s

volumes:
  coze_loop_nginx_data:
  coze_loop_redis_data:
  coze_loop_mysql_data:
  coze_loop_clickhouse_data:
  coze_loop_minio_data:
  coze_loop_minio_config:
  coze_loop_rmq_namesrv_data:
  coze_loop_rmq_broker_data:
  coze_loop_python_faas_workspace:
  coze_loop_js_faas_workspace:

networks:
  coze-loop-network:
    name: clipanvil-coze-loop-network
    driver: bridge
